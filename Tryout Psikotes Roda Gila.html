<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tryout Psikotes Roda Gila</title>
<style>
:root{--red:#c8102e;--tint:#fdecee;--bg:#fff;--bg2:#faf5f5;--tx:#2b1215;--mu:#7b5f64;--bd:#ecd8db;--ok:#1b8a4b;--okt:#e6f6ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#d92b43;--tint:#3a1a1f;--bg:#1b1214;--bg2:#241719;--tx:#f7ebec;--mu:#c1a3a7;--bd:#47292e;--ok:#4cc27f;--okt:#14301f}}
:root[data-theme="dark"]{--red:#d92b43;--tint:#3a1a1f;--bg:#1b1214;--bg2:#241719;--tx:#f7ebec;--mu:#c1a3a7;--bd:#47292e;--ok:#4cc27f;--okt:#14301f}
*{box-sizing:border-box}body{margin:0;background:var(--bg2);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--red);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-size:18px}.timer{margin-left:auto;font:700 20px ui-monospace,monospace;background:#fff;color:var(--red);padding:3px 12px;border-radius:99px}.timer.low{animation:bl 1s infinite}@keyframes bl{50%{opacity:.45}}
.bar{height:5px;background:var(--tint);position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:19}.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.wrap{max-width:1000px;margin:14px auto;padding:0 12px;display:grid;grid-template-columns:1fr 270px;gap:14px;align-items:start}@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:16px}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fig{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:6px}.fig svg{display:block;width:100%;height:auto;max-height:340px}
.qt{font-size:17px;margin:12px 0 4px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;font:inherit;cursor:pointer}
.opt b{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--red);display:grid;place-items:center;flex:none}
.opt.sel{border-color:var(--red);background:var(--tint)}.opt.sel b{background:var(--red);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okt)}.opt.right b{background:var(--ok);color:#fff}.opt.wrong{border-color:var(--red);background:var(--tint)}.opt.wrong b{background:var(--red);color:#fff}
.opt small{margin-left:auto;font-weight:600}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}.btn:disabled{opacity:.4}
.btn.ghost{background:var(--tint);color:var(--red)}.btn.w{background:#fff;color:var(--red);margin-left:0}.btn.big{padding:14px 34px;font-size:18px}
.nav{display:flex;justify-content:space-between;margin-top:12px}
.fl{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:99px;padding:4px 12px;cursor:pointer;font:inherit;font-size:14px}.fl.on{background:#fff3d6;color:#8a5a00;border-color:#f5a300}
h4{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px}
.grid button{aspect-ratio:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px;font-size:11px;padding:0;cursor:pointer}
.grid .a{background:var(--red);color:#fff;border-color:var(--red)}.grid .f{outline:2px solid #f5a300}.grid .c{box-shadow:0 0 0 2px var(--tx)}
.lg{font-size:13px;color:var(--mu);margin:8px 0 0}
.hero{max-width:560px;margin:30px auto;padding:0 16px;text-align:center}.hero .logo{font-size:56px;background:var(--red);color:#fff;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px}
.hero h1{color:var(--red);margin:6px 0}.rule{text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:14px 14px 14px 34px;margin:16px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:16px}.modal div{background:var(--bg);border-radius:16px;padding:20px;max-width:380px;text-align:center}.modal p{margin:0 0 14px}.modal .btn{margin:4px}
.sum{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.ring{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--tint) 0);display:grid;place-items:center}.ring span{width:100px;height:100px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chips button{border:1px solid var(--red);background:var(--bg);color:var(--red);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}.chips .on{background:var(--red);color:#fff}
.rv{max-width:1000px;margin:12px auto;border-left:6px solid #999}.rv.ok{border-left-color:var(--ok)}.rv.ng{border-left-color:var(--red)}
.rh{display:flex;justify-content:space-between}.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--bg2)}.tag.ok{background:var(--okt);color:var(--ok)}.tag.ng{background:var(--tint);color:var(--red)}
.ex{background:var(--tint);border-radius:12px;padding:4px 14px 10px;margin-top:10px}.ex p,.ex ul{margin:8px 0}
.ch{display:inline-block;padding:0 9px;border-radius:99px;font-weight:700;color:#fff;margin:1px}.ch.cw{background:var(--red)}.ch.cc{background:#2b2d42}
</style></head><body><div id="app"></div>
<script>
const A=document.getElementById('app');let rnd,qs,ans,flg,cur,end,tmr,used,fil='all';
const mk=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pk=a=>a[ri(0,a.length-1)];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const DN=d=>d>0?'kanan':'kiri',SY=d=>d>0?'↻':'↺',gcd=(a,b)=>b?gcd(b,a%b):a;
const RULE='<b>Aturan emas roda gigi:</b> dua roda bergigi yang saling bersentuhan selalu berputar <b>berlawanan arah</b>. Jadi roda berjarak <i>genap</i> dari roda penggerak berputar <b>searah</b>, jarak <i>ganjil</i> berputar <b>berlawanan</b>. Roda yang tidak bersentuhan tidak ikut bergerak (<b>diam</b>).';
function graph(n,iso){for(let tr=0;tr<300;tr++){const g=[{t:ri(12,24),x:0,y:0}],E=[];g[0].r=g[0].t*2;let ok=true;const tot=n+(iso?1:0);
for(let i=1;i<tot&&ok;i++){const il=iso&&i==n;let pl=false;
for(let k=0;k<80&&!pl;k++){const p=ri(0,i-1),t=ri(12,24),r=t*2,P=g[p],a=rnd()*6.283,d=P.r+r+(il?ri(9,16):0),x=P.x+d*Math.cos(a),y=P.y+d*Math.sin(a);
if(g.every((q,j)=>(j==p&&!il)||Math.hypot(q.x-x,q.y-y)>q.r+r+8)){g.push({t,r,x,y});if(!il)E.push([p,i]);pl=true}}
if(!pl)ok=false}
if(ok){const adj=g.map(()=>[]);E.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a)});const lt=sh('ABCDEFGHIJKLMNOPQRSTU'.split(''));g.forEach((q,i)=>q.l=lt[i]);return{g,adj,n:tot,m:n}}}}
function bfs(G,s){const d=G.g.map(()=>-1),par=G.g.map(()=>-1);d[s]=0;const q=[s];while(q.length){const u=q.shift();G.adj[u].forEach(v=>{if(d[v]<0){d[v]=d[u]+1;par[v]=u;q.push(v)}})}return{d,par}}
const pathTo=(B,t)=>{const p=[];for(let v=t;v>=0;v=B.par[v])p.unshift(v);return p};
function gp(x,y,r,n,ph){let d='';const a0=2*Math.PI/n;for(let i=0;i<n;i++){const a=ph+i*a0;[[a-a0*.28,r-4],[a-a0*.16,r+4],[a+a0*.16,r+4],[a+a0*.28,r-4]].forEach((q,j)=>{d+=(i+j?'L':'M')+(x+q[1]*Math.cos(q[0])).toFixed(1)+' '+(y+q[1]*Math.sin(q[0])).toFixed(1)})}return d+'Z'}
function ar(g,d,c,R,w,h){const a1=(d>0?-150:-30)*Math.PI/180,a2=(d>0?-30:-150)*Math.PI/180,P=a=>[+(g.x+R*Math.cos(a)).toFixed(1),+(g.y+R*Math.sin(a)).toFixed(1)],s=P(a1),e=P(a2),tx=-Math.sin(a2)*d,ty=Math.cos(a2)*d,nx=Math.cos(a2),ny=Math.sin(a2);
return `<path d="M${s}A${R} ${R} 0 0 ${d>0?1:0} ${e}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><polygon fill="${c}" points="${e[0]+tx*h*1.4},${e[1]+ty*h*1.4} ${e[0]+nx*h*.6},${e[1]+ny*h*.6} ${e[0]-nx*h*.6},${e[1]-ny*h*.6}"/>`}
function svg(G,o){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;G.g.forEach(q=>{x0=Math.min(x0,q.x-q.r-28);y0=Math.min(y0,q.y-q.r-28);x1=Math.max(x1,q.x+q.r+28);y1=Math.max(y1,q.y+q.r+28)});
const pal=['#e63946','#f4a261','#2a9d8f','#457b9d','#8d5fd3','#e9c46a','#52b788','#ff7aa2','#6c8ebf','#f28482'];
let s=`<svg viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" role="img" aria-label="Susunan roda gila">`;
G.g.forEach((q,i)=>{const d=o.dirs?o.dirs[i]:0,f=o.dirs?(d>0?'#c8102e':d<0?'#2b2d42':'#b9b9c3'):pal[i%10];s+=`<path d="${gp(q.x,q.y,q.r,q.t,i*.7)}" fill="${f}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>`});
if(o.path)s+=`<polyline points="${o.path.map(i=>G.g[i].x.toFixed(1)+','+G.g[i].y.toFixed(1)).join(' ')}" fill="none" stroke="#ffd23f" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/>`;
G.g.forEach((q,i)=>{const d=o.dirs?o.dirs[i]:0;if(d)s+=ar(q,d,'#fff',Math.min(q.r-5,Math.max(18,q.r*.64)),2.5,6);
if(o.tgt==i)s+=`<circle cx="${q.x}" cy="${q.y}" r="${q.r+9}" fill="none" stroke="#1b8a4b" stroke-width="3.5" stroke-dasharray="6 4"/>`;
s+=`<circle cx="${q.x}" cy="${q.y}" r="${o.teeth?15:13}" fill="#fff"/><text x="${q.x}" y="${q.y+(o.teeth?0:5.5)}" text-anchor="middle" font-size="15" font-weight="800" fill="#222">${q.l}</text>`;
if(o.teeth)s+=`<text x="${q.x}" y="${q.y+11}" text-anchor="middle" font-size="10" font-weight="700" fill="#666">${q.t}</text>`});
if(o.src!=null)s+=ar(G.g[o.src],o.sd,o.ac,G.g[o.src].r+12,3.4,9);
return s+'</svg>'}
function build(type){const iso=type=='iso'||(type!='fast'&&rnd()<.3),G=graph(ri(7,9),iso);if(!G)return;const m=G.m,cons=[...Array(m).keys()],s=pk(cons),sd=pk([1,-1]),B=bfs(G,s),
dirs=G.g.map((_,i)=>B.d[i]<0?0:sd*(B.d[i]%2?-1:1)),L=i=>G.g[i].l,B_=i=>`<b>${L(i)}</b>`;
const chip=i=>`<span class="ch ${dirs[i]>0?'cw':'cc'}">${L(i)}${SY(dirs[i])}</span>`,chain=p=>p.map(chip).join(' → ');
const lv=()=>{let o='';for(let k=0;k<=Math.max(...B.d);k++){const ids=cons.filter(i=>B.d[i]==k);if(ids.length)o+=`<li>Jarak ${k}: ${ids.map(chip).join(' ')} → ${DN(dirs[ids[0]])}</li>`}return `<ul>${o}</ul>`};
let txt,opts,a,tgt,path,teeth=false,ex='';const give=`Jika roda ${B_(s)} berputar ke <b>${DN(sd)}</b>`;
if(type=='dir'||type=='iso'){const t=type=='iso'?m:pk(cons.filter(i=>B.d[i]>=3));if(t==null)return;tgt=t;opts=['Kanan','Kiri','Tengah','Diam','Sama saja'];txt=`${give}, maka roda ${B_(t)} berputar ke arah….`;
if(type=='iso'){a=3;ex=`<p>${RULE}</p><p>Roda ${B_(t)} tidak bersentuhan dengan roda mana pun, sehingga tidak ada gigi yang mendorongnya. Jawaban: <b>Diam</b>. Pilihan “Sama saja” dan “Tengah” hanyalah pengecoh.</p><p>Roda yang bergerak: ${chain(cons.sort((x,y)=>B.d[x]-B.d[y]))}</p>`}
else{path=pathTo(B,t);const k=B.d[t];a=dirs[t]>0?0:1;ex=`<p>${RULE}</p><p>Jalur penggerak: ${chain(path)}</p><p>Dari ${B_(s)} ke ${B_(t)} ada <b>${k}</b> persentuhan → ${k%2?'ganjil, arah berlawanan':'genap, arah sama'} dengan roda ${L(s)} (${DN(sd)}). Jadi roda ${B_(t)} berputar ke <b>${DN(dirs[t])}</b>.</p>`}}
else if(type=='cnt'){const ask=pk([1,-1]),c=cons.filter(i=>i!=s&&dirs[i]==ask).length;txt=`${give}, berapa banyak roda (selain roda ${B_(s)}) yang berputar ke <b>${DN(ask)}</b>?`;
opts=sh([c,...sh([c-3,c-2,c-1,c+1,c+2,c+3,c+4].filter(v=>v>=0)).slice(0,4)]).map(v=>v+' roda');a=opts.indexOf(c+' roda');
ex=`<p>${RULE}</p><p>Kelompokkan roda berdasarkan jarak dari ${B_(s)}:</p>${lv()}<p>Roda yang berputar ke ${DN(ask)} (selain ${L(s)}) berjumlah <b>${c}</b>.${iso?' Roda terpisah tidak dihitung karena diam.':''}</p>`}
else if(type=='same'){const y=pk(cons.filter(i=>i!=s)),cs=cons.filter(i=>i!=y&&dirs[i]==dirs[y]).map(i=>L(i)).sort(),f=x=>x.length?x.join(', '):'Tidak ada',set=new Set([f(cs)]);let gd=0;
while(set.size<5&&gd++<300){const c=new Set(cs);for(let j=ri(1,2);j>0;j--){const l=G.g[ri(0,G.n-1)].l;c.has(l)?c.delete(l):c.add(l)}set.add(f([...c].sort()))}
if(set.size<5)return;tgt=y;opts=sh([...set]);a=opts.indexOf(f(cs));txt=`${give}, roda manakah yang berputar <b>searah</b> dengan roda ${B_(y)}? (selain roda ${L(y)} sendiri)`;
ex=`<p>${RULE}</p>${lv()}<p>Roda ${B_(y)} berputar ke ${DN(dirs[y])}. Roda lain yang searah: <b>${f(cs)}</b>.${iso?' Roda terpisah tidak berputar sehingga tidak termasuk.':''}</p>`}
else if(type=='fast'){teeth=true;const mn=Math.min(...cons.map(i=>G.g[i].t));if(cons.filter(i=>G.g[i].t==mn).length>1)return;const f=cons.find(i=>G.g[i].t==mn),big=cons.reduce((x,y)=>G.g[y].t>G.g[x].t?y:x,0);
const ids=[f,big,...(iso?[m]:[]),...sh([...Array(G.n).keys()])].filter((v,i,r)=>r.indexOf(v)==i).slice(0,5);opts=sh(ids).map(i=>'Roda '+L(i));a=opts.indexOf('Roda '+L(f));tgt=f;
txt=`Angka pada roda menunjukkan jumlah gigi. ${give}. Roda manakah yang berputar <b>paling cepat</b> (putaran terbanyak)?`;
ex=`<p>Roda yang bersentuhan menempuh <b>jumlah gigi yang sama</b> dalam waktu yang sama, sehingga <b>putaran × gigi = tetap</b>. Gigi paling sedikit → putaran paling banyak.</p><p>Gigi: ${cons.map(i=>`${L(i)}=${G.g[i].t}`).join(', ')}.${iso?` Roda ${L(m)} (${G.g[m].t} gigi) terpisah dan diam, jangan tertipu.`:''}</p><p>Gigi terkecil: roda <b>${L(f)}</b> (${mn} gigi). Jawaban: <b>Roda ${L(f)}</b>.</p>`}
else{teeth=true;const t=pk(cons.filter(i=>B.d[i]>=2));if(t==null)return;const tx=G.g[s].t,ty=G.g[t].t,k=ri(1,3)*ty/gcd(tx,ty),v=k*tx/ty,cd=dirs[t],fm=(v,d)=>`${+v.toFixed(2)} putaran ke ${DN(d)}`,set=[];
[[v,cd],[v,-cd],[k,cd],[k*ty/tx,cd],[v+ri(1,3),-cd],[v*2,cd],[v+1,cd],[v>1?v-1:v+2,-cd]].forEach(c=>{const z=fm(...c);if(!set.includes(z))set.push(z)});if(set.length<5)return;
opts=sh([set[0],...sh(set.slice(1)).slice(0,4)]);a=opts.indexOf(set[0]);tgt=t;path=pathTo(B,t);
txt=`Roda ${B_(s)} (${tx} gigi) diputar <b>${k} putaran ke ${DN(sd)}</b>. Roda ${B_(t)} (${ty} gigi) akan berputar sebanyak….`;
ex=`<p>${RULE}</p><p>Jalur: ${chain(path)} (roda perantara hanya membalik arah, tidak mengubah laju).</p><p><b>Putaran ${L(t)} = putaran ${L(s)} × gigi ${L(s)} ÷ gigi ${L(t)}</b> = ${k} × ${tx} ÷ ${ty} = <b>${+v.toFixed(2)}</b> putaran.</p><p>Arah: ${B.d[t]} persentuhan → ${B.d[t]%2?'berlawanan':'searah'} dengan ${L(s)}, yaitu ke <b>${DN(cd)}</b>. Jawaban: <b>${set[0]}</b>.</p>`}
return{G,txt,opts,a,ex,qo:{src:s,sd,ac:'#c8102e',teeth},eo:{dirs,path,tgt,src:s,sd,ac:'#f5a300',teeth}}}
function gen(){rnd=mk(Date.now()&0xffffff);const ty=sh([...Array(30).fill('dir'),...Array(10).fill('iso'),...Array(14).fill('cnt'),...Array(16).fill('same'),...Array(12).fill('fast'),...Array(18).fill('spd')]);
qs=ty.map(t=>{let q,g=0;while(!q&&g++<300)q=build(t);return q})}
function intro(){clearInterval(tmr);A.innerHTML=`<div class="hero"><div class="logo">⚙</div><h1>Tryout Psikotes<br>Roda Gila</h1><p style="color:var(--mu)">100 soal • 50 menit • tingkat sulit</p><ul class="rule"><li>Arah <b>kanan</b> = searah jarum jam, <b>kiri</b> = berlawanan.</li><li>Enam tipe soal: arah putaran, roda terpisah (jebakan), menghitung roda, roda searah, kecepatan (jumlah gigi), dan perbandingan putaran.</li><li>Soal diacak baru setiap tryout.</li><li>Pembahasan lengkap dengan gambar tampil setelah selesai.</li></ul><button class="btn big" data-a="go">Mulai Tryout</button></div>`}
function begin(){gen();ans=Array(100).fill(-1);flg=Array(100).fill(0);cur=0;end=Date.now()+3e6;clearInterval(tmr);tmr=setInterval(tick,500);draw();scrollTo(0,0)}
function tick(){const e=document.getElementById('tm');if(!e)return;const r=Math.max(0,Math.round((end-Date.now())/1000));e.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');e.classList.toggle('low',r<300);if(!r)finish()}
function draw(){const q=qs[cur];A.innerHTML=`<div class="top"><b class="brand">⚙ Roda Gila</b><span class="timer" id="tm"></span><button class="btn w" data-a="fin">Selesai</button></div><div class="bar"><i style="width:${ans.filter(x=>x>=0).length}%"></i></div>
<div class="wrap"><main class="card"><div class="qh"><span>Soal <b>${cur+1}</b> / 100</span><button class="fl ${flg[cur]?'on':''}" data-a="fl">⚑ ${flg[cur]?'Ditandai':'Tandai ragu'}</button></div><div class="fig">${svg(q.G,q.qo)}</div><p class="qt">${q.txt}</p>
${q.opts.map((o,i)=>`<button class="opt ${ans[cur]==i?'sel':''}" data-i="${i}"><b>${'ABCDE'[i]}</b>${o}</button>`).join('')}
<div class="nav"><button class="btn ghost" data-a="pv" ${cur?'':'disabled'}>← Sebelumnya</button><button class="btn" data-a="nx" ${cur<99?'':'disabled'}>Berikutnya →</button></div></main>
<aside class="card"><h4>Navigasi soal</h4><div class="grid">${qs.map((_,i)=>`<button data-n="${i}" class="${ans[i]>=0?'a':''} ${flg[i]?'f':''} ${i==cur?'c':''}">${i+1}</button>`).join('')}</div><p class="lg">Merah = terjawab • bingkai kuning = ragu • bingkai gelap = soal ini</p></aside></div>`;tick()}
function finish(){clearInterval(tmr);used=Math.min(3000,Math.round((3e6-(end-Date.now()))/1000));fil='all';result()}
const st=i=>ans[i]<0?'em':ans[i]==qs[i].a?'ok':'ng';
function result(){const ok=qs.filter((_,i)=>st(i)=='ok').length,ng=qs.filter((_,i)=>st(i)=='ng').length,em=100-ok-ng,mm=Math.floor(used/60),ss=used%60;
const fl=[['all','Semua',100],['ng','Salah',ng],['ok','Benar',ok],['em','Kosong',em]];
A.innerHTML=`<div class="top"><b class="brand">⚙ Hasil Tryout</b><button class="btn w" style="margin-left:auto" data-a="go">Ulangi (soal baru)</button></div><div class="wrap" style="grid-template-columns:1fr"><div class="card sum"><div class="ring" style="--p:${ok}"><span>${ok}</span></div><div><h2 style="margin:0;color:var(--red)">Nilai: ${ok} / 100</h2><p style="margin:6px 0">✅ Benar <b>${ok}</b> • ❌ Salah <b>${ng}</b> • ⬜ Kosong <b>${em}</b><br>⏱ Waktu dipakai ${mm} menit ${ss} detik</p><p class="lg">${ok>=80?'Luar biasa! Pertahankan ketelitianmu.':ok>=60?'Cukup baik. Pelajari pembahasan soal yang salah.':'Terus berlatih: kuasai dulu aturan genap-ganjil dan perhitungan gigi.'}</p></div></div>
<div class="chips">${fl.map(f=>`<button class="${fil==f[0]?'on':''}" data-f="${f[0]}">${f[1]} (${f[2]})</button>`).join('')}</div></div>
${qs.map((q,i)=>{const s=st(i);if(fil!='all'&&fil!=s)return'';return `<article class="card rv ${s}"><div class="rh"><b>Soal ${i+1}</b><span class="tag ${s}">${{ok:'Benar',ng:'Salah',em:'Tidak dijawab'}[s]}</span></div><p class="qt">${q.txt}</p><div class="fig">${svg(q.G,q.eo)}</div>
<p class="lg">Merah ↻ = berputar kanan • hitam ↺ = berputar kiri • abu-abu = diam • garis kuning putus-putus = jalur gerak • panah oranye = putaran awal • cincin hijau = roda yang ditanya</p>
${q.opts.map((o,j)=>`<div class="opt ${j==q.a?'right':j==ans[i]?'wrong':''}"><b>${'ABCDE'[j]}</b>${o}<small>${j==q.a?'✔ Kunci':j==ans[i]?'Jawabanmu':''}</small></div>`).join('')}<div class="ex"><h4>Pembahasan</h4>${q.ex}</div></article>`}).join('')}`}
A.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.i!=null){ans[cur]=+d.i;draw()}else if(d.n!=null){cur=+d.n;draw();scrollTo(0,0)}else if(d.f){fil=d.f;result()}
else if(d.a=='go')begin();else if(d.a=='pv'&&cur){cur--;draw();scrollTo(0,0)}else if(d.a=='nx'&&cur<99){cur++;draw();scrollTo(0,0)}
else if(d.a=='fl'){flg[cur]^=1;draw()}else if(d.a=='fin'){const u=ans.filter(x=>x<0).length;A.insertAdjacentHTML('beforeend',`<div class="modal"><div><p><b>Akhiri tryout?</b><br>${u?u+' soal belum dijawab.':'Semua soal sudah dijawab.'}</p><button class="btn ghost" data-a="no">Kembali</button><button class="btn" data-a="yes">Ya, selesai</button></div></div>`)}
else if(d.a=='no')document.querySelector('.modal').remove();else if(d.a=='yes')finish()};
intro();
</script></body></html>
